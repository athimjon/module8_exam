<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Status</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #6c5ce7;
            --secondary-color: #a29bfe;
            --accent-color: #fd79a8;
            --light-color: #f8f9fa;
            --dark-color: #343a40;
        }

        body {
            background-color: #f5f6fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .status-form-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            max-width: 600px;
            margin: 0 auto;
        }

        .form-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 25px;
            text-align: center;
        }

        .form-body {
            padding: 30px;
        }

        .form-title {
            font-weight: 600;
            margin-bottom: 0;
        }

        .form-icon {
            font-size: 2rem;
            margin-bottom: 15px;
        }

        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(108, 92, 231, 0.25);
        }

        .form-label {
            font-weight: 500;
            color: var(--dark-color);
            margin-bottom: 8px;
        }

        .btn-submit {
            background-color: var(--primary-color);
            border: none;
            border-radius: 8px;
            padding: 12px 25px;
            font-weight: 500;
            width: 100%;
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #5649d1;
            transform: translateY(-2px);
        }

        .form-switch .form-check-input {
            width: 3em;
            height: 1.5em;
            margin-left: 0;
        }

        .form-switch .form-check-input:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .active-label {
            font-weight: 500;
            color: var(--dark-color);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="status-form-container">
        <div class="form-header">
            <div class="form-icon">
                <i class="fas fa-columns"></i>
            </div>
            <h3 class="form-title">Create New Status</h3>
        </div>

        <div class="form-body">
            <form id="createStatusForm" method="post" action="/status/create">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-4">
                    <label for="statusName" class="form-label">Status Name</label>
                    <input type="text" class="form-control" id="statusName" name="name" required
                           placeholder="Enter Name(e.g.'NEW/IN PROGRESS') all in CAPS">
                    <div class="form-text">Status names must be unique</div>
                </div>


                <div class="d-flex justify-content-start mt-4 gap-3">
                    <a href="/" class="btn btn-dark text-white p-2">Cancel</a>
                    <button type="submit" class="btn btn-submit text-white">
                        <i class="fas fa-plus-circle me-2"></i> Create Status
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>

</script>
</body>
</html>
