<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Roles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<h1 class="bg-dark text-white text-center p-3 mb-4">User Role Management</h1>

<div class="container">
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Full Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <form th:action="@{/users/changeRole}" method="post">
                <td th:text="${user.id}"></td>
                <td th:text="${user.fullName}"></td>
                <td th:text="${user.email}"></td>
                <td>
                    <input type="hidden" name="userId" th:value="${user.id}"/>
                    <select class="form-select" name="roleNames" multiple required>
                        <option th:each="role : ${roles}"
                                th:value="${role.roleName}"
                                th:text="${role.roleName.name()}"
                                th:selected="${#lists.contains(user.roles, role)}">
                        </option>
                    </select>
                </td>
                <td>
                    <button type="submit" class="btn btn-primary btn-sm">Save</button>
                </td>
            </form>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
