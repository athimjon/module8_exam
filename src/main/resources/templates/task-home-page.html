<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .circle-icon {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 16px;
        }
        .check {
            background-color: #4CAF50; /* green */
        }
        .cross {
            background-color: #f44336; /* red */
        }
        :root {
            --primary-color: #6c5ce7;
            --secondary-color: #a29bfe;
            --accent-color: #fd79a8;
            --light-color: #f8f9fa;
            --dark-color: #343a40;
            --edit-color: #00b894;
            --left-color: #0984e3;
            --right-color: #e17055;
        }

        body {
            background-color: #f5f6fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .dashboard-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 20px 0;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border-radius: 0 0 15px 15px;
        }

        .status-column {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            padding: 20px;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            border-top: 5px solid var(--primary-color);
        }

        .status-column:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .status-header {
            font-weight: 600;
            color: var(--dark-color);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-card {
            background-color: var(--light-color);
            border-radius: 10px;
            padding: 0;
            margin-bottom: 15px;
            border-left: 4px solid var(--accent-color);
            transition: all 0.2s ease;
            overflow: hidden;
        }

        .task-card:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
        }

        .task-image {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-bottom: 1px solid #eee;
        }

        .task-content {
            padding: 15px;
        }

        .task-title {
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--dark-color);
        }

        .task-description {
            font-size: 13px;
            color: #666;
            margin-bottom: 15px;
        }

        .user-info {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .user-img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 10px;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .user-name {
            font-size: 13px;
            font-weight: 500;
        }

        .btn-primary-custom {
            background-color: var(--primary-color);
            border: none;
            border-radius: 8px;
            padding: 8px 15px;
            font-weight: 500;
        }

        .btn-primary-custom:hover {
            background-color: #5649d1;
            transform: translateY(-2px);
        }

        .btn-accent {
            background-color: var(--accent-color);
            border: none;
            border-radius: 8px;
            padding: 8px 15px;
            font-weight: 500;
            color: white;
        }

        .btn-accent:hover {
            background-color: #e84393;
            color: white;
            transform: translateY(-2px);
        }

        .btn-edit {
            background-color: var(--edit-color);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 12px;
        }

        .btn-left {
            background-color: var(--left-color);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 12px;
        }

        .btn-right {
            background-color: var(--right-color);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 12px;
        }

        .btn-edit:hover, .btn-left:hover, .btn-right:hover {
            opacity: 0.9;
            color: white;
            transform: translateY(-1px);
        }

        .task-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .status-container {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-bottom: 20px;
        }

        .status-column {
            min-width: 280px;
        }

        /* User Profile Dropdown Styles */
        .user-profile-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .profile-trigger {
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .profile-trigger:hover {
            transform: scale(1.05);
        }

        .profile-image {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .profile-image:hover {
            border-color: var(--accent-color);
        }

        .profile-dropdown {
            position: absolute;
            right: 0;
            top: 70px;
            width: 300px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            z-index: 1000;
            background: linear-gradient(135deg, #ffffff, #f8f9fa);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .profile-dropdown.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .profile-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .profile-header-image {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-color);
            margin-right: 15px;
        }

        .profile-name {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--dark-color);
            margin-bottom: 5px;
        }

        .profile-email {
            font-size: 0.85rem;
            color: #666;
        }

        .profile-details {
            margin-bottom: 15px;
        }

        .profile-roles {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .role-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .role-admin {
            background-color: #fd79a8;
            color: white;
        }

        .role-user {
            background-color: #a29bfe;
            color: white;
        }

        .role-programmer {
            background-color: #00cec9;
            color: white;
        }

        .role-maintainer {
            background-color: #fdcb6e;
            color: #2d3436;
        }

        .profile-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }

        .profile-btn {
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .profile-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
        }

        .btn-logout {
            background-color: #ff7675;
            color: white;
            border: none;
        }

        .btn-settings {
            background-color: var(--primary-color);
            color: white;
            border: none;
        }
    </style>
</head>
<body>
<div class="dashboard-header">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-6">
                <h1><i class="fas fa-tasks me-2"></i> Task Management</h1>
            </div>
            <div class="col-md-6 text-end">
                <!-- User Profile Dropdown - Thymeleaf Version -->
                <div class="user-profile-container">
                    <div class="profile-trigger" id="profileTrigger">
                        <img th:if="${#authentication.principal.attachment != null}"
                             th:src="'/attachment/view/' + ${#authentication.principal.attachment.id}"
                             th:alt="${#authentication.principal.getFullName()}" class="profile-image">
                        <img th:unless="${#authentication.principal.attachment != null}"
                             th:src="'https://ui-avatars.com/api/?name=' + ${#authentication.principal.getFullName()} + '&background=6c5ce7&color=fff'"
                             th:alt="${#authentication.principal.getFullName()}" class="profile-image">
                    </div>

                    <div class="profile-dropdown" id="profileDropdown">
                        <div class="profile-header">
                            <img th:if="${#authentication.principal.attachment != null}"
                                 th:src="'/attachment/view/' + ${#authentication.principal.attachment.id}"
                                 th:alt="${#authentication.principal.getFullName()}" class="profile-header-image">
                            <img th:unless="${#authentication.principal.attachment != null}"
                                 th:src="'https://ui-avatars.com/api/?name=' + ${#authentication.principal.getFullName()} + '&background=6c5ce7&color=fff'"
                                 th:alt="${#authentication.principal.getFullName()}" class="profile-header-image">

                            <div>
                                <div class="profile-name" th:text="${#authentication.principal.getFullName()}">User Name</div>
                                <div class="profile-email" th:text="${#authentication.principal.email}">user@example.com</div>
                            </div>
                        </div>

                        <div class="profile-details">
                            <h6 class="fw-bold mb-3">User Information</h6>
                            <div class="profile-roles">
                                <th:block th:each="role : ${#authentication.principal.roles}">
                                    <div th:classappend="'role-' + ${role.roleName.toString().toLowerCase().replace('role_', '')}">
                                        <span class="role-badge" th:text="${role.roleName.toString().replace('ROLE_', '')}">ROLE</span>
                                    </div>
                                </th:block>
                            </div>
                        </div>

                        <div class="profile-actions">
                            <a href="/user/profile/settings" class="profile-btn btn-settings">
                                <i class="fas fa-cog me-1"></i> Settings
                            </a>
                            <form th:action="@{/logout}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="profile-btn btn-logout">
                                    <i class="fas fa-sign-out-alt me-1"></i> Logout
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="nav-buttons">
                    <a href="/user" class="btn btn-dark">User Management</a>
                    <a href="/task" class="btn btn-accent me-2">
                        <i class="fas fa-plus me-1"></i> Create Task
                    </a>
                    <a href="/status/update" class="btn btn-warning">
                        Manage Status order
                    </a>
                    <a href="/status" class="btn btn-primary-custom">
                        <i class="fas fa-columns me-1 "></i> Add Status
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="container">
    <div class="status-container">
        <!-- Status columns will be populated dynamically -->
        <div class="status-column" th:each="status:${statuses}">
            <div class="status-header">
                <span th:text="${status.name}">Status</span>
                <span th:if="${status.isActive}" class="circle-icon check">✔</span>
                <span th:if="${!status.isActive}" class="circle-icon cross">✖</span>
            </div>

            <div th:each="task:${tasks}" th:if="${task.status.name.equals(status.name)}">
                <div class="task-card">
                    <img th:if="${task.attachment != null}" th:src="'/attachment/view/' + ${task.attachment.id}"
                         alt="Task Image" class="task-image">
                    <img th:unless="${task.attachment != null}"
                         src="https://images.unsplash.com/photo-1571171637578-41bc2dd41cd2?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=60"
                         alt="Task Image" class="task-image">

                    <div class="task-content">
                        <h6 class="task-title" th:text="${task.title}">Task Title</h6>
                        <p class="task-description" th:text="${task.description}">Task description</p>

                        <div class="user-info">
                            <img th:if="${task.user.attachment != null}"
                                 th:src="'/attachment/view/' + ${task.user.attachment.id}"
                                 alt="User" class="user-img">
                            <img th:unless="${task.user.attachment != null}"
                                 src="https://randomuser.me/api/portraits/men/32.jpg"
                                 alt="User" class="user-img">
                            <span class="user-name" th:text="${task.user.getFullName()}">User Name</span>
                        </div>

                        <div class="task-actions">
                            <form th:action="'/task/update/' + ${task.id}">
                                <button class="btn btn-edit">
                                    <i class="fas fa-pencil-alt"></i> Edit
                                </button>
                            </form>

                            <div>
                                <form method="post" action="/task/update/right">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <input th:name="taskId" th:value="${task.id}" type="hidden">
                                    <button th:if="${!status.positionNumber.equals(max)}" class="btn btn-right">
                                        <i class="fas fa-arrow-right"></i>
                                    </button>
                                </form>
                                <form method="post" action="/task/update/left">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <input th:name="taskId" th:value="${task.id}" type="hidden">
                                    <button th:if="${!status.positionNumber.equals(min)}" class="btn btn-left me-2">
                                        <i class="fas fa-arrow-left"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Profile dropdown toggle
    document.getElementById('profileTrigger').addEventListener('click', function() {
        document.getElementById('profileDropdown').classList.toggle('active');
    });

    // Close dropdown when clicking outside
    document.addEventListener('click', function(event) {
        const dropdown = document.getElementById('profileDropdown');
        const trigger = document.getElementById('profileTrigger');

        if (!dropdown.contains(event.target) && !trigger.contains(event.target)) {
            dropdown.classList.remove('active');
        }
    });
</script>
</body>
</html>
