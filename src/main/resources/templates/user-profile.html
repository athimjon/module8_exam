<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Custom CSS -->
    <style>
        :root {
            --primary-color: #6c5ce7;
            --secondary-color: #a29bfe;
            --accent-color: #fd79a8;
            --light-color: #f8f9fa;
            --dark-color: #343a40;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        .profile-card {
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: none;
            transition: all 0.3s ease;
            background: white;
        }

        .profile-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .profile-header {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .profile-avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .profile-name {
            font-weight: 700;
            margin-top: 1rem;
            font-size: 1.8rem;
        }

        .profile-email {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .profile-body {
            padding: 2rem;
        }

        .section-title {
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 1.5rem;
            position: relative;
            padding-bottom: 0.5rem;
        }

        .section-title:after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 50px;
            height: 3px;
            background: var(--accent-color);
        }

        .info-item {
            margin-bottom: 1rem;
        }

        .info-label {
            font-weight: 600;
            color: var(--dark-color);
        }

        .info-value {
            color: #6c757d;
        }

        .role-badge {
            background: var(--secondary-color);
            color: white;
            padding: 0.35rem 0.75rem;
            border-radius: 50px;
            font-size: 0.85rem;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
            display: inline-block;
        }

        .edit-btn {
            background: var(--accent-color);
            border: none;
            border-radius: 50px;
            padding: 0.5rem 1.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .edit-btn:hover {
            background: #e84393;
            transform: translateY(-2px);
        }

        .save-btn {
            background: var(--primary-color);
            border: none;
            border-radius: 50px;
            padding: 0.5rem 1.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .save-btn:hover {
            background: #5649d1;
            transform: translateY(-2px);
        }

        .form-control {
            border-radius: 10px;
            padding: 0.75rem 1rem;
            border: 1px solid #e0e0e0;
        }

        .form-control:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 0.25rem rgba(108, 92, 231, 0.25);
        }

        .avatar-upload {
            position: relative;
            display: inline-block;
        }

        .avatar-upload-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: var(--accent-color);
            color: white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="profile-card">
                <!-- Profile Header -->
                <div class="profile-header">
                    <div class="avatar-upload">
                        <img th:src="${user.attachment != null} ? @{'/attachment/view/'+ ${user.attachment.id}} : 'https://ui-avatars.com/api/?name=' + ${user.getFullName()} + '&background=random'"
                             alt="Profile Image" class="profile-avatar">
                        <div class="avatar-upload-btn" data-bs-toggle="modal" data-bs-target="#avatarModal">
                            <i class="fas fa-camera"></i>
                        </div>
                    </div>
                    <h1 class="profile-name" th:text="${user.getFullName()}">User Name</h1>
                    <p class="profile-email" th:text="${user.email}">user@example.com</p>
                </div>

                <!-- Profile Body -->
                <div class="profile-body">
                    <div class="mb-5">
                        <h3 class="section-title">Roles</h3>
                        <div class="d-flex flex-wrap">
                                <span th:each="role : ${user.roles}" class="role-badge">
                                    <i class="fas fa-user-shield me-1"></i>
                                    <span th:text="${role.roleName.getUserRoleName()}">ROLE_USER</span>
                                </span>
                        </div>
                    </div>
                    <!-- Personal Information Section -->
                    <div class="mb-5">
                        <h3 class="section-title">Personal Information</h3>
                        <form th:action="@{/user/profile/update}" th:object="${user}" method="post" id="profileForm" enctype="multipart/form-data">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" name="userId" th:value="${user.id}">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="info-item">
                                        <label class="info-label">First Name</label>
                                        <input type="text" class="form-control" th:field="*{firstName}" id="firstName" readonly>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="info-item">
                                        <label class="info-label">Last Name</label>
                                        <input type="text" class="form-control" th:field="*{lastName}" id="lastName" readonly>
                                    </div>
                                </div>
                            </div>
                            <div class="info-item">
                                <label class="info-label">Email</label>
                                <input type="email" class="form-control" th:field="*{email}" readonly>
                            </div>
                            <div class="d-flex justify-content-end mt-4">
                                <div><a href="/" class="btn btn-dark text-white mr-3 ml-3">↩️Return | Done✅ </a></div>
                                <a href="/" type="button" class="btn btn-warning me-2 ml-2" id="cancelEdit" style="display: none;">Cancel</a>
                                <button type="button" class="btn edit-btn text-white" id="editProfile">
                                    <i class="fas fa-edit me-2"></i>Edit Profile
                                </button>
                                <button type="submit" class="btn save-btn text-white ml-2" id="saveProfile" style="display: none;">
                                    <i class="fas fa-save me-2"></i>Save Changes
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- Roles Section -->


                    <!-- Change Password Section -->
<!--                    <div>-->
<!--                        <h3 class="section-title">Change Password</h3>-->
<!--                        <form th:action="@{/profile/change-password}" method="post">-->
<!--                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>-->

<!--                            <div class="info-item">-->
<!--                                <label class="info-label">Current Password</label>-->
<!--                                <input type="password" class="form-control" name="currentPassword" required>-->
<!--                            </div>-->
<!--                            <div class="info-item">-->
<!--                                <label class="info-label">New Password</label>-->
<!--                                <input type="password" class="form-control" name="newPassword" required>-->
<!--                            </div>-->
<!--                            <div class="info-item">-->
<!--                                <label class="info-label">Confirm New Password</label>-->
<!--                                <input type="password" class="form-control" name="confirmPassword" required>-->
<!--                            </div>-->
<!--                            <div class="d-flex justify-content-end mt-4">-->
<!--                                <button type="submit" class="btn save-btn text-white">-->
<!--                                    <i class="fas fa-key me-2"></i>Change Password-->
<!--                                </button>-->
<!--                            </div>-->
<!--                        </form>-->
<!--                    </div>-->
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Avatar Upload Modal -->
<div class="modal fade" id="avatarModal" tabindex="-1" aria-labelledby="avatarModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="avatarModalLabel">Change Profile Picture</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form th:action="@{/user/profile/update}" method="post" enctype="multipart/form-data">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="userId" th:value="${user.id}">
                    <div class="mb-3">
                        <label for="avatarFile" class="form-label">Select an image</label>
                        <input class="form-control" type="file" id="avatarFile" name="file" accept="image/*" required>
                    </div>
                    <div class="d-flex justify-content-end">
                        <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn save-btn text-white">Upload</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const editBtn = document.getElementById('editProfile');
        const cancelBtn = document.getElementById('cancelEdit');
        const saveBtn = document.getElementById('saveProfile');
        const firstNameInput = document.getElementById('firstName');
        const lastNameInput = document.getElementById('lastName');

        editBtn.addEventListener('click', function() {
            firstNameInput.readOnly = false;
            lastNameInput.readOnly = false;
            editBtn.style.display = 'none';
            cancelBtn.style.display = 'block';
            saveBtn.style.display = 'block';

            // Add focus to first name field
            firstNameInput.focus();
        });

        cancelBtn.addEventListener('click', function() {
            firstNameInput.readOnly = true;
            lastNameInput.readOnly = true;
            editBtn.style.display = 'block';
            cancelBtn.style.display = 'none';
            saveBtn.style.display = 'none';

            // Reset form (you might want to implement actual form reset)
            document.getElementById('profileForm').reset();
        });
    });
</script>
</body>
</html>
