<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification | SparkleMail</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@400;600;700&display=swap"
          rel="stylesheet">

    <style>
        :root {
            --primary-color: #6c5ce7;
            --secondary-color: #a29bfe;
            --accent-color: #fd79a8;
            --light-color: #f8f9fa;
            --dark-color: #343a40;
            --success-color: #00b894;
            --warning-color: #fdcb6e;
            --danger-color: #d63031;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 20px;
        }

        .verification-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        .verification-header {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            padding: 30px;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .verification-header::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 70%);
            transform: rotate(30deg);
        }

        .verification-body {
            padding: 40px;
        }

        .verification-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            margin-bottom: 10px;
            position: relative;
            display: inline-block;
        }

        .verification-title::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 50px;
            height: 4px;
            background: var(--accent-color);
            border-radius: 2px;
        }

        .verification-icon {
            font-size: 60px;
            margin-bottom: 20px;
            color: var(--primary-color);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-20px);
            }
            60% {
                transform: translateY(-10px);
            }
        }

        .otp-input-group {
            display: flex;
            justify-content: center;
            margin: 30px 0;
        }

        .otp-input {
            width: 50px;
            height: 60px;
            margin: 0 8px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            border: 2px solid #ddd;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .otp-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2);
            outline: none;
            transform: translateY(-3px);
        }

        .btn-verify {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            border: none;
            padding: 12px 30px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
            transition: all 0.3s;
        }

        .btn-verify:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.6);
        }

        .btn-resend {
            background: white;
            color: var(--dark-color);
            border: 2px solid var(--secondary-color);
            padding: 10px 25px;
            font-weight: 600;
            border-radius: 50px;
            transition: all 0.3s;
        }

        .btn-resend:hover {
            background: var(--secondary-color);
            color: white;
        }

        .verification-footer {
            text-align: center;
            padding: 20px;
            background: var(--light-color);
            font-size: 14px;
            color: #666;
        }

        .status-message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success {
            background-color: rgba(0, 184, 148, 0.1);
            color: var(--success-color);
            border-left: 4px solid var(--success-color);
        }

        .error {
            background-color: rgba(214, 48, 49, 0.1);
            color: var(--danger-color);
            border-left: 4px solid var(--danger-color);
        }

        .timer {
            color: var(--accent-color);
            font-weight: 600;
            margin-top: 10px;
        }

        .floating-decoration {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(253, 121, 168, 0.1);
            z-index: -1;
        }

        .decoration-1 {
            top: -30px;
            right: -30px;
            width: 150px;
            height: 150px;
        }

        .decoration-2 {
            bottom: -50px;
            left: -50px;
            width: 200px;
            height: 200px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="floating-decoration decoration-1"></div>
    <div class="floating-decoration decoration-2"></div>

    <div class="verification-card">
        <div class="verification-header">
            <h2 class="verification-title">EMAIL VERIFICATION</h2>
            <p>Enter the 6-digit code sent to your email address</p>
        </div>

        <div class="verification-body text-center">
            <div class="verification-icon">
                <i class="fas fa-envelope-open-text"></i>
            </div>

            <div id="statusMessage" class="status-message">
                <i class="fas fa-check-circle me-2"></i><span id="messageText"></span>
            </div>
            <div  th:text="${session.error}" class="text-center text-danger fw-bold" style="font-weight:bold ">
                ERROR
            </div>
            <form id="verificationForm" th:action="@{/register/verify}" method="post">
                <div class="otp-input-group">
                    <input type="text" class="otp-input" maxlength="1" data-index="1" autocomplete="off">
                    <input type="text" class="otp-input" maxlength="1" data-index="2" autocomplete="off">
                    <input type="text" class="otp-input" maxlength="1" data-index="3" autocomplete="off">
                    <input type="text" class="otp-input" maxlength="1" data-index="4" autocomplete="off">
                    <input type="text" class="otp-input" maxlength="1" data-index="5" autocomplete="off">
                    <input type="text" class="otp-input" maxlength="1" data-index="6" autocomplete="off">
                </div>

                <input type="hidden" id="fullOtp" name="otp">
                <input type="hidden" th:value="${session.otp}" id="sessionOtp">

                <div class="d-flex justify-content-between align-items-center mt-4">
                    <a href="/register/send/email" type="button" id="resendBtn" class="btn btn-resend">
                        <i class="fas fa-redo me-2"></i>Send Again
                    </a>

                    <button type="submit" id="submitBtn" class="btn btn-verify" disabled>
                        <i class="fas fa-check-circle me-2"></i>Verify
                    </button>
                </div>

                <div class="timer mt-3">
                    <i class="fas fa-clock me-2"></i>
                    <span id="countdown">02:00</span>
                </div>
            </form>
        </div>

        <div class="verification-footer">
            <p>Didn't receive the code? Check your spam folder or <a href="#" id="resendLink">resend</a></p>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const otpInputs = document.querySelectorAll('.otp-input');
        const fullOtpInput = document.getElementById('fullOtp');
        const submitBtn = document.getElementById('submitBtn');
        const sessionOtp = document.getElementById('sessionOtp').value;
        const statusMessage = document.getElementById('statusMessage');
        const messageText = document.getElementById('messageText');
        const resendBtn = document.getElementById('resendBtn');
        const resendLink = document.getElementById('resendLink');
        const countdownElement = document.getElementById('countdown');

        // OTP input handling
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', function () {
                if (this.value.length === 1) {
                    if (index < otpInputs.length - 1) {
                        otpInputs[index + 1].focus();
                    }
                }

                updateFullOtp();
                checkOtp();
            });

            input.addEventListener('keydown', function (e) {
                if (e.key === 'Backspace' && this.value.length === 0 && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
        });

        function updateFullOtp() {
            let otp = '';
            otpInputs.forEach(input => {
                otp += input.value;
            });
            fullOtpInput.value = otp;
            submitBtn.disabled = otp.length !== 6;
        }

        function checkOtp() {
            const enteredOtp = fullOtpInput.value;
            if (enteredOtp.length === 6) {
                if (enteredOtp === sessionOtp) {
                    showStatus('Code verified successfully!', 'success');
                } else {
                    showStatus('Invalid verification code. Please try again.', 'error');
                }
            } else {
                hideStatus();
            }
        }

        function showStatus(message, type) {
            statusMessage.style.display = 'block';
            statusMessage.className = `status-message ${type}`;
            messageText.textContent = message;
        }

        function hideStatus() {
            statusMessage.style.display = 'none';
        }

        // Resend functionality
        function handleResend() {
            // Here you would typically make an AJAX call to resend the OTP
            showStatus('New verification code has been sent to your email.', 'success');
            startCountdown();

            // Clear existing inputs
            otpInputs.forEach(input => input.value = '');
            fullOtpInput.value = '';
            submitBtn.disabled = true;
            otpInputs[0].focus();
        }

        resendBtn.addEventListener('click', handleResend);
        resendLink.addEventListener('click', function (e) {
            e.preventDefault();
            handleResend();
        });

        // Countdown timer
        function startCountdown() {
            let minutes = 2;
            let seconds = 0;

            const countdown = setInterval(function () {
                if (seconds === 0) {
                    if (minutes === 0) {
                        clearInterval(countdown);
                        countdownElement.textContent = "Expired";
                        resendBtn.disabled = false;
                        resendLink.style.display = "inline";
                        return;
                    }
                    minutes--;
                    seconds = 59;
                } else {
                    seconds--;
                }

                const displayMinutes = minutes < 10 ? `0${minutes}` : minutes;
                const displaySeconds = seconds < 10 ? `0${seconds}` : seconds;
                countdownElement.textContent = `${displayMinutes}:${displaySeconds}`;
            }, 1000);

            resendBtn.disabled = true;
            resendLink.style.display = "none";
        }

        // Start initial countdown
        startCountdown();

        // Focus first input on load
        otpInputs[0].focus();
    });
</script>
</body>
</html>
